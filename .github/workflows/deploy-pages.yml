# Builds the site and publishes it to GitHub Pages on every push to main.
# Settings → Pages → Source must be "GitHub Actions".
# The hosted database is Neon. Its Auth and Data API URLs are public by design:
# all access control is enforced in Postgres (GRANTs + Row Level Security).
# Override them with repository Actions variables of the same name if needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Type-check
        run: bunx tsc --noEmit
        continue-on-error: true
      - run: bun test tests/unit
      - run: bun run build
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_NEON_AUTH_URL: ${{ vars.PUBLIC_NEON_AUTH_URL || 'https://ep-silent-mode-bhh6vhss.neonauth.c-10.eu-central-1.aws.neon.tech/neondb/auth' }}
          PUBLIC_NEON_DATA_API_URL: ${{ vars.PUBLIC_NEON_DATA_API_URL || 'https://ep-silent-mode-bhh6vhss.apirest.c-10.eu-central-1.aws.neon.tech/neondb/rest/v1' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
