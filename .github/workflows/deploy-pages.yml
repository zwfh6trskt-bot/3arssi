# Builds the site and publishes it to GitHub Pages on every push to main.
# Settings → Pages → Source must be "GitHub Actions".
# The Supabase URL and anon key are public by design (RLS protects the data);
# they are set in the repository's Actions *variables* (not secrets):
#   PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --production
      - run: bun test tests/unit
      - run: bun run build
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
